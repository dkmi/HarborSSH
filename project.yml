name: HarborSSH
options:
  developmentLanguage: en
  bundleIdPrefix: com.harbor
  deploymentTarget:
    iOS: '17.0'
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: 8e7a1e154f470e19c709a00a8768df348ba5fc43
targets:
  HarborSSH:
    type: application
    platform: iOS
    sources: [HarborSSH]
    dependencies:
      - package: Citadel
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harbor.ssh
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID unlocks your SSH servers and credentials.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to SSH servers on your local network.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Harbor SSH
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  HarborSSHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarborSSHTests
        excludes: [Fixtures, ssh_fixture.py]
      - path: HarborSSHTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: HarborSSH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  HarborSSH:
    build:
      targets:
        HarborSSH: all
    test:
      targets: [HarborSSHTests]
